---
apiVersion: io.lsst.cmservice/v1
kind: schedule
metadata:
  owner: root
spec:
  auto_start: false
  cron: "0 0 * * 4"  # Thursdays at 0000Z
  expressions:
    today: "datetime.now(timezone.utc)"
    sasquatch_timestamp: "datetime.now(timezone.utc).strftime('%Y%m%dT000000Z')"
    weekly: "'w_2026_45'"
    ticket: "'DM-56970'"
  name_format: "%s"
