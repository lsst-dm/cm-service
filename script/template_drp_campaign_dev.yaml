    pipeline_yaml: "${DRP_PIPE_DIR}/pipelines/LSSTCam/DRP.yaml#step4d-measure-variability-global,step4e-measure-variability-rgb"
    extra_qgraph_options:
      - "-c parameters:base_uri=/sdf/data/rubin/shared/hips_views/LSSTCam/runs/DRP/${{ ticket }}"
      - "-c parameters:sasquatch_dataset_identifier=LSSTCam/DRP"
