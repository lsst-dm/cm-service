      - "-c parameters:sasquatch_dataset_identifier=LSSTCam/DRP"
      - "-c parameters:sasquatch_timestamp_version=explicit_timestamp:${{ sasquatch_timestamp }}"
  groups: null
---
apiVersion: io.lsst.cmservice/v1
kind: lsst
metadata:
  name: slac_drp_weekly
  default: true
spec:
  campaign: DRP Reprocessing
  description: LSSTCam Intermittent DRP
  environment:
    OMP_NUM_THREADS: "1"
    # NUMEXPR_MAX_THREADS: "1"
    OMP_PROC_BIND: "false"
    LSST_S3_USE_THREADS: "False"
  lsst_distrib_dir: /cvmfs/sw.lsst.eu/almalinux-x86_64/lsst_distrib/${{ weekly }}
  lsst_version: ${{ weekly }}
  project: DRP Reprocessing
  ticket: ${{ ticket }}
---
apiVersion: io.lsst.cmservice/v1
kind: bps
metadata:
  name: bps_drp_reprocessing
  default: true
spec:
  extra_qgraph_options:
    - "-c parameters:sasquatch_dataset_identifier=LSSTCam/DRP"
    - "-c parameters:sasquatch_timestamp_version=explicit_timestamp:${{ sasquatch_timestamp }}"
  extra_run_quantum_options:
    - "--no-raise-on-partial-outputs"
  extra_aggregate_options:
    - "--worker-log-dir {submitPath}/jobs/finalJob"
    - "--output {submitPath}/{uniqProcName}_prov.qg"
  include_files:
    - ${DRP_PIPE_DIR}/bps/clustering/LSSTCam/DRP-clustering.yaml
    - ${DRP_PIPE_DIR}/bps/resources/LSSTCam/DRP.yaml
    - ${DRP_PIPE_DIR}/bps/compression/LSSTCam/DRP-compression.yaml
  literals:
    priority: 900
    numberOfRetries: 4
    memoryMultiplier: 2
    retryUnlessExit:
      - 2
    finalJob:
      command2: >
        ${DAF_BUTLER_DIR}/bin/butler provenance-report --format json
        '{submitPath}/{uniqProcName}_prov.qg' > '{submitPath}/{uniqProcName}_prov.json'
---
apiVersion: io.lsst.cmservice/v1
kind: butler
metadata:
  name: dp2_prep
  default: true
spec:
  collections:
    campaign_input:
      - LSSTCam/raw/20250604-20250921/SV_320_15/DM-57008/7040
      - LSSTCam/calib
      - refcats
      - skymaps
      - pretrained_models
      - LSSTCam/calib/fgcmcal
      - mpcorb
      - sorcha_cache
    campaign_public_output: "u/lsstsvc1/runs/DRP/${{ weekly }}/${{ ticket }}"
    campaign_output: "u/lsstsvc1/runs/DRP/${{ weekly }}/${{ ticket }}"
  include_files: []
  predicates:
    - instrument='LSSTCam'
    - skymap='lsst_cells_v2'
  repo: dp2_prep
---
apiVersion: io.lsst.cmservice/v1
kind: wms
metadata:
  name: htcondor_auto
  default: true
spec:
  auto_provision: true
  batch_system: htcondor
  service_class: lsst.ctrl.bps.htcondor.HTCondorService
  # These are WMS-specific provisioning options BPS uses for allocateNodes
  provisioned_idle_time: 240
  provisioned_max_wall_time: '1-0:0:0'
  provisioned_node_count: 330
  provisioned_extra_arguments:
    - "--cpus 110"
    - "--exclusive"
---
apiVersion: io.lsst.cmservice/v1
kind: site
metadata:
  name: slac_s3df
  default: true
  labels:
    compute-site: slac
spec:
  facility: SLAC
  # These are Site-specific provisioning options BPS uses for allocateNodes
  provisioned_account_group: rubin:production
  provisioned_platform: s3df
  provisioned_queue: torino
  # provisioned_queue: torino
  # These temporary settings set up site-specific botocore/butler env vars
  # and will be moved to a "library" so they are not user-managed
  botocore_config_file: "${HOME}/.lsst/aws-config.cmservice-dev.ini"
  botocore_credentials_file: "${HOME}/.lsst/aws-credentials.cmservice-dev.ini"
  lsst_db_auth_file: "${HOME}/.lsst/db-auth.cmservice-dev.yaml"
  lsst_data_repos_file: "${HOME}/.lsst/data-repos.cmservice-dev.yaml"
---
