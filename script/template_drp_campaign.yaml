# Campaign is run serially
# stage1[a..d] -> stage2[a,c..f] -> stage3[a..d] -> stage4[a..f]
# via discrete steps
---
apiVersion: io.lsst.cmservice/v1
kind: campaign
metadata:
  name: lsstcam_drp_${{ weekly }}
spec:
  notification_labels:
    - default
---
apiVersion: io.lsst.cmservice/v1
kind: node
metadata:
  kind: step
  name: STEP_1A
spec:
  bps:
    pipeline_yaml: "${DRP_PIPE_DIR}/pipelines/LSSTCam/DRP.yaml#step1a-single-visit-detectors"
    extra_qgraph_options:
      - "--dataset-query-constraint raw"
      - "-c parameters:sasquatch_dataset_identifier=LSSTCam/DRP"
      - "-c parameters:sasquatch_timestamp_version=explicit_timestamp:${{ sasquatch_timestamp }}"
  groups: null
---
apiVersion: io.lsst.cmservice/v1
