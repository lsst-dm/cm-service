---
name: CM Service Smoketest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

env:
  BUILDKIT_PROGRESS: plain
  CM_ENDPOINT: "http://localhost:8080/api"
  COMPOSE_PROFILES: full
  LOGGING__LEVEL: "ERROR"
  NO_COLOR: "1"
  UV_VERSION: "0.12.x"
  UV_FROZEN: "1"

jobs:
  smoketest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_SQREREADONLY_USERNAME }}
          password: ${{ secrets.DOCKERHUB_SQREREADONLY_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"

      - name: Install packages for smoketest
        run: uv sync --frozen --package lsst-cmservice-commandline

      - name: Build and start services
        working-directory: ./integration
        run: |
          docker compose build --pull --quiet
          docker compose --env-file shared.env up -d --wait

      - name: Load seed manifests
        id: load-seed
        env:
          LOGGING__STREAM: stderr
          UV_NO_SYNC: "1"
        run: |
          uv run -q cm load yaml integration/seed_manifests.yaml

      - name: Load smoketest schedule
        id: load-smoke
        env:
          LOGGING__STREAM: stderr
          UV_NO_SYNC: "1"
        run: |
          SCHEDID=$(uv run -q cm --output json schedules load integration/smoketest.yaml | jq -r '.self | split("/") | .[-1]')
          echo "id=$SCHEDID" >> $GITHUB_OUTPUT

      # The schedule's `day_obs` expression is yesterday. The butler is seeded
      # for both today and yesterday, so overriding `day_obs` with today
      # exercises the oneshot override with data that exists.
      - name: Oneshot smoketest schedule
        id: oneshot-smoke
        env:
          LOGGING__STREAM: stderr
          UV_NO_SYNC: "1"
        run: |
          DAY_OBS=$(date -u +%Y%m%d)
          URL=$(
            uv run -q cm --output json schedules oneshot ${{ steps.load-smoke.outputs.id }} -e "day_obs=${DAY_OBS}" \
            | jq -r '.new_campaign_url'
          )
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "day_obs=$DAY_OBS" >> $GITHUB_OUTPUT

      - name: Validate the oneshot override is applied
        run: |
          campaign=$(curl -s "${{ steps.oneshot-smoke.outputs.url }}")
          jq -e --argjson day_obs "${{ steps.oneshot-smoke.outputs.day_obs }}" \
            '.metadata.day_obs == $day_obs and .metadata.values.day_obs == $day_obs' \
            <<< "$campaign"

      - name: Wait for campaign to complete
        run: |
          TIMEOUT=300
          ELAPSED=0
          INTERVAL=10
          while [ $ELAPSED -lt $TIMEOUT ]; do
            status=$(curl -s "${{ steps.oneshot-smoke.outputs.url }}" | jq -r '.status')
            echo "Campaign status is $status..."
            if [ "$status" = "accepted" ]; then
              exit 0
            elif [ "$status" = "failed" ]; then
              docker compose logs cmworker
              exit 1
            else
              sleep $INTERVAL
            fi
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          exit 1

      - name: Validate a Kafka notification is produced
        run: |
          NOTIFICATION=$(
            timeout 10s docker run --rm --network host confluentinc/cp-kafkacat:latest \
            kafkacat -b localhost:9094 -t smoketest -C -o beginning -c 1
          )
          test -n "$NOTIFICATION" && jq -r . <<< "$NOTIFICATION"

      - name: Collect artifacts on failure
        if: failure()
        working-directory: ./integration
        run: |
          docker compose logs > ${{ runner.temp }}/service-logs.txt
          docker compose ps > ${{ runner.temp }}/service-status.txt

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: debug-logs
          path: ${{ runner.temp }}/service-*.txt

      - name: Clean up
        if: always()
        working-directory: ./integration
        run: docker compose --profile full down -v
