---
name: CM Service Smoketest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

env:
  BUILDKIT_PROGRESS: plain
  CM_ENDPOINT: "http://localhost:8080/api"
  COMPOSE_PROFILES: full
  LOGGING__LEVEL: "ERROR"
  NO_COLOR: "1"
  UV_VERSION: "0.12.x"
  UV_FROZEN: "1"

jobs:
  smoketest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_SQREREADONLY_USERNAME }}
          password: ${{ secrets.DOCKERHUB_SQREREADONLY_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"

      - name: Install packages for smoketest
        run: uv sync --frozen --package lsst-cmservice-commandline

      - name: Build and start services
        working-directory: ./integration
        run: |
          docker compose build --pull --quiet
          docker compose --env-file shared.env up -d --wait

      - name: Load seed manifests
        id: load-seed
        env:
          LOGGING__STREAM: stderr
          UV_NO_SYNC: "1"
        run: |
          uv run -q cm load yaml integration/seed_manifests.yaml

      - name: Load smoketest schedule
        id: load-smoke
        env:
          LOGGING__STREAM: stderr
          UV_NO_SYNC: "1"
        run: |
          SCHEDID=$(uv run -q cm --output json schedules load integration/smoketest.yaml | jq -r '.self | split("/") | .[-1]')
          echo "id=$SCHEDID" >> $GITHUB_OUTPUT

      # The schedule's static `name_format` makes the campaign name, and so its
      # UUID5 id in the default namespace, known before the campaign exists.
      # The `smoketest-inbound` topic is created by the `kafka-init` service,
      # so the CM consumer is subscribed to it before this message is produced.
      # The override is a JSON number, because a trigger's overrides are used
      # as values, not compiled as expressions.
      - name: Trigger smoketest schedule with a Kafka message
        id: trigger-smoke
        env:
          UV_NO_SYNC: "1"
        run: |
          CAMPAIGN_ID=$(
            uv run -q python -I -c '
          from uuid import uuid5
          from lsst.cmservice.models.enums import DEFAULT_NAMESPACE
          print(uuid5(DEFAULT_NAMESPACE, "smoketest_trigger"))'
          )
          DAY_OBS=$(date -u +%Y%m%d)
          TRIGGER_MESSAGE=$(jq -cn --argjson day_obs "$DAY_OBS" '{type: "smoketest", detail: {day_obs: $day_obs}}')
          docker run --rm -i --network host confluentinc/cp-kafkacat:latest \
            kafkacat -b localhost:9094 -t smoketest-inbound -P <<< "$TRIGGER_MESSAGE"
          echo "url=${CM_ENDPOINT}/v2/campaigns/${CAMPAIGN_ID}" >> $GITHUB_OUTPUT
          echo "day_obs=$DAY_OBS" >> $GITHUB_OUTPUT

      - name: Wait for the triggered campaign to be created
        working-directory: ./integration
        run: |
          TIMEOUT=300
          ELAPSED=0
          INTERVAL=10
          until [ "$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.trigger-smoke.outputs.url }}")" = "200" ]; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timed out waiting for the triggered campaign to be created" >&2
              docker compose logs cmworker
              exit 1
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

      - name: Validate the trigger override is applied
        run: |
          campaign=$(curl -s "${{ steps.trigger-smoke.outputs.url }}")
          jq -e --argjson day_obs "${{ steps.trigger-smoke.outputs.day_obs }}" \
            '.metadata.day_obs == $day_obs and .metadata.values.day_obs == $day_obs' \
            <<< "$campaign"

      - name: Wait for campaign to complete
        working-directory: ./integration
        run: |
          TIMEOUT=300
          ELAPSED=0
          INTERVAL=10
          while [ $ELAPSED -lt $TIMEOUT ]; do
            status=$(curl -s "${{ steps.trigger-smoke.outputs.url }}" | jq -r '.status')
            echo "Campaign status is $status..."
            if [ "$status" = "accepted" ]; then
              exit 0
            elif [ "$status" = "failed" ]; then
              docker compose logs cmworker
              exit 1
            else
              sleep $INTERVAL
            fi
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          exit 1

      - name: Validate a Kafka notification is produced
        run: |
          NOTIFICATION=$(
            timeout 10s docker run --rm --network host confluentinc/cp-kafkacat:latest \
            kafkacat -b localhost:9094 -t smoketest -C -o beginning -c 1
          )
          test -n "$NOTIFICATION" && jq -r . <<< "$NOTIFICATION"

      - name: Collect artifacts on failure
        if: failure()
        working-directory: ./integration
        run: |
          docker compose logs > ${{ runner.temp }}/service-logs.txt
          docker compose ps > ${{ runner.temp }}/service-status.txt

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: debug-logs
          path: ${{ runner.temp }}/service-*.txt

      - name: Clean up
        if: always()
        working-directory: ./integration
        run: docker compose --profile full down -v
