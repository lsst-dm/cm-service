# CI workflow runs linting, typing, and unit tests on pull request targeting
# the main branch.
# For stacked PRs only, a build workflow is called for the head of the stack.
# PRs created by stack actions will not trigger CI.
---
name: "CI"

"on":
  workflow_dispatch:
    inputs:
      create_artifacts:
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      create_artifacts:
        type: boolean
        required: false
        default: false

  # Every pull request in a stack is evaluated as if it targets the base of the stack
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.x"
  UV_FROZEN: "1"
  TEST__LOCAL_DB: "1"  # signals test fixtures to not use testcontainers

jobs:
  commitlint:
    uses:
      ./.github/workflows/commitlint.yaml

  lint:
    runs-on: ubuntu-latest
    needs:
      - commitlint
    steps:

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d  # v3.1.0

  mypy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    needs:
      - commitlint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install packages for testing
        run: uv sync --dev --frozen --all-extras

      - name: Run tests
        run: uv run make typing

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    needs:
      - lint
      - mypy
    steps:

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        if: github.actor != 'dependabot[bot]'
        with:
          username: ${{ vars.DOCKERHUB_SQREREADONLY_USERNAME }}
          password: ${{ secrets.DOCKERHUB_SQREREADONLY_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install packages for testing
        run: uv sync --dev --all-packages --frozen

      - name: Run tests
        run: |
          uv run playwright install
          uv run make test

  test:
    runs-on: ubuntu-latest
    needs:
      - test-matrix
    steps:
      - name: Test matrix passed
        run: echo "Test matrix has passed"

  build-and-push:
    if: >-
      (
        startsWith(github.head_ref, 'u/') &&
        inputs.create_artifacts
      ) ||
      (
        startsWith(github.head_ref, 'tickets/DM-') &&
        (
          github.event.pull_request.stack == null ||
          github.event.pull_request.stack.position == github.event.pull_request.stack.size
        )
      )
    needs:
      - test
    uses: ./.github/workflows/build_and_push.yaml
    secrets: inherit
