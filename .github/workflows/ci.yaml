# CI workflow runs linting, typing, and unit tests on pull request targeting
# the main branch.
# For stacked PRs only, a build workflow is called for the head of the stack.
# PRs created by stack actions will not trigger CI.
---
name: "CI"

"on":
  workflow_dispatch:
    inputs:
      create_artifacts:
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      create_artifacts:
        type: boolean
        required: false
        default: false

  # Every pull request in a stack is evaluated as if it targets the base of the stack
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.x"
  UV_FROZEN: "1"
  TEST__LOCAL_DB: "1"  # signals test fixtures to not use testcontainers

jobs:
  commitlint:
    uses:
      ./.github/workflows/commitlint.yaml

  lint:
    runs-on: ubuntu-latest
    needs:
      - commitlint
    steps:

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0

  mypy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    needs:
      - commitlint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install packages for testing
        run: uv sync --dev --frozen --all-extras

      - name: Run tests
        run: uv run make typing

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    needs:
      - lint
      - mypy
    steps:

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install packages for testing
        run: uv sync --dev --all-packages --frozen

      - name: Run tests
        run: |
          uv run playwright install
          uv run make test

  test:
    runs-on: ubuntu-latest
    needs:
      - test-matrix
    steps:
      - name: Test matrix passed
        run: echo "Test matrix has passed"

  build-and-push:
    if: >-
      inputs.create_artifacts ||
      (
        github.event.pull_request.stack == null ||
        github.event.pull_request.stack.position == github.event.pull_request.stack.size
      )
    needs:
      - test
    uses: ./.github/workflows/build_and_push.yaml
    secrets: inherit
