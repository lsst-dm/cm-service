# CI workflow runs linting, typing, and unit tests on every push to a branch
# and when called from another workflow.
---
name: "CI"

"on":
  workflow_call:
  push:
    branches:
      - "tickets/**"
      - "u/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.x"
  UV_FROZEN: "1"
  TEST__LOCAL_DB: "1"  # signals test fixtures to not use testcontainers

jobs:
  commitlint:
    uses:
      ./.github/workflows/commitlint.yaml

  lint:
    runs-on: ubuntu-latest
    needs:
      - commitlint
    steps:

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Run prek
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece  # v3.0.0

  mypy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    needs:
      - commitlint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install packages for testing
        run: uv sync --dev --frozen --all-extras

      - name: Run tests
        run: uv run make typing

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    needs:
      - lint
      - mypy
    steps:

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install packages for testing
        run: uv sync --dev --all-packages --frozen

      - name: Run tests
        run: |
          uv run playwright install
          uv run make test

  test:
    runs-on: ubuntu-latest
    needs:
      - test-matrix
    steps:
      - name: Test matrix passed
        run: echo "Test matrix has passed"

  build-and-push:
    needs:
      - test
    if: ${{ startsWith(github.ref_name, 'tickets/DM-') }}
    uses: ./.github/workflows/build_and_push.yaml
    secrets: inherit
