# A workflow that builds and pushes the Docker container image artifacts for
# the application. The action occurs on new tags and when called from another
# workflow.
---
name: "Build and Push"

"on":
  push:
    tags:
      - "*"
  workflow_call:
  workflow_dispatch:

jobs:

  build:
    name: "Build and Push Application Container Images"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: cmservice
            image: ${{ github.repository_owner }}/cm-service
          - target: cmworker
            image: ${{ github.repository_owner }}/cm-worker
          - target: cmweb
            image: ${{ github.repository_owner }}/cm-web
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Login to DHI
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_SQREREADONLY_USERNAME }}
          password: ${{ secrets.DOCKERHUB_SQREREADONLY_TOKEN }}

      - uses: lsst-sqre/build-and-push-to-ghcr@d583ad50f606e6077f0ec23f081519cf92717fd7  # v1.5.2
        with:
          dockerfile: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          image: ${{ matrix.image }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push: true
